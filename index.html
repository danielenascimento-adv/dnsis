<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DNsis</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4D0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DNsis">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--navy:#4D0E13;--blue:#6D2932;--sky:#C48A6E;--cream:#F3E2D6;--bg:#F7F2EC;--card:#fff;--ink:#2B1A1C;--mut:#76605F;--line:#E8DDD2;--acc:#6D2932;--ok:#1f7a48;--warn:#b7740c;--bad:#b3362b;--soft:#F5E9E4}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.serif,h1{font-family:"Cormorant Garamond",Garamond,"Times New Roman",Georgia,serif}
#app{display:flex;min-height:100vh}
#nav{width:220px;background:var(--navy);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
#nav .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:var(--cream);text-decoration:none}
#nav .brand img{width:46px;height:40px;object-fit:cover;border-radius:4px}
#nav .brand b{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-size:24px;letter-spacing:2px;line-height:1.1;font-weight:600;letter-spacing:.3px}
#nav .brand small{display:block;font-size:10px;letter-spacing:.8px;font-family:system-ui,sans-serif;font-weight:400;color:var(--sky);text-transform:none;white-space:nowrap}
#nav a.n{color:#EBD6CC;text-decoration:none;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;margin-bottom:2px}
#nav a.n:hover{background:rgba(255,255,255,.07)}
#nav a.n.on{background:var(--cream);color:var(--navy);font-weight:600}
#nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
#nav .foot{margin-top:auto;font-size:11px;color:#C9A39A;padding:10px}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#banner{background:#4D0E13;line-height:0}#banner img{width:100%;height:auto;display:block;max-height:240px;object-fit:cover;object-position:left center}
header{display:flex;gap:10px;align-items:center;padding:10px 20px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header input{flex:1;max-width:480px}
main{padding:20px;max-width:1200px;width:100%}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cdd3dc;border-radius:8px;background:#fff;color:inherit;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:-1px}
button,.btn{font:inherit;cursor:pointer;border:1px solid #cdd3dc;background:#fff;border-radius:8px;padding:7px 13px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--sky)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.big{background:var(--navy);border-color:var(--navy);color:var(--cream);font-weight:600}
button.danger{color:var(--bad)}
button.ic{border:none;background:none;padding:4px 6px;color:var(--mut)}
button.ic:hover{color:var(--ink)}
h1{font-size:28px;margin:0 0 2px;font-weight:600;color:var(--navy)}
h2{font-size:16px;margin:0 0 10px;color:var(--navy)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat span{color:var(--mut);font-size:13px}
.stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex-shrink:0}
.grow{flex:1;min-width:0}
.sub{color:var(--mut);font-size:13px}
.late{box-shadow:inset 4px 0 0 var(--bad);padding-left:12px}
.today{box-shadow:inset 4px 0 0 var(--warn);padding-left:12px}
.soon{box-shadow:inset 4px 0 0 #e2c35e;padding-left:12px}
.rel{font-size:12px;color:var(--mut);white-space:nowrap}
.late .rel{color:var(--bad);font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--blue);font-weight:600;vertical-align:1px}
.tag.g{background:#e2f2e8;color:var(--ok)} .tag.r{background:#f9e5e3;color:var(--bad)} .tag.y{background:#fbf0d8;color:var(--warn)} .tag.n{background:#eceef1;color:var(--mut)}
a{color:var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters>*{width:auto;flex:0 1 auto}
.filters input[type=search]{flex:1 1 240px}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.row:last-child{border-bottom:none}
.row:hover{background:#faf8f3}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.empty{color:var(--mut);padding:18px;text-align:center}
.conv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.conv .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.conv .txt{white-space:pre-wrap;margin:6px 0}
.nx{background:#fbf5e4;border-radius:8px;padding:6px 10px;font-size:14px;white-space:pre-wrap}
.day{font-weight:700;color:var(--mut);font-size:13px;margin:16px 0 6px}
.day:first-letter{text-transform:uppercase}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 12px;color:var(--mut)}
.tabs button.on{border-color:var(--blue);color:var(--ink);font-weight:600}
dl.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:0}
dl.info dt{font-size:12px;color:var(--mut)} dl.info dd{margin:0;white-space:pre-wrap;word-break:break-word}
.situ{background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:#ebe6da;border-radius:12px;padding:10px;min-height:120px}
.kcol h3{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between;color:var(--navy)}
.kcard{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kcard select{margin-top:6px;padding:4px 6px;font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;background:#faf8f3}
.num{text-align:right;white-space:nowrap}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:auto}
#modal{position:fixed;inset:0;background:rgba(77,14,19,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 12px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:700px;padding:18px 20px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mhead h3{margin:0;color:var(--navy)}
.x{border:none!important;font-size:26px;line-height:1;padding:0 6px;background:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.fld.w2{grid-column:1/-1}
.fld.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.fld.chk input{width:auto}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick .filt{flex:1 1 100%}
.pick select{flex:1;min-width:0}
.mfoot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#fab{display:none}
.consulta .acts .big,.consulta .acts .pri,.consulta header .big{display:none!important}
.banner{background:#fbf5e4;border:1px solid #ecd9a6;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;background:var(--sky);border-radius:4px 4px 0 0;min-height:2px}
.bars div.cur i{background:var(--blue)}
.cartao{max-width:640px;width:100%;border-radius:14px;box-shadow:0 8px 30px rgba(77,14,19,.25);display:block}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 18px;border-radius:10px;z-index:99;display:none}
@media(max-width:820px){
 #app{flex-direction:column}
 #nav{width:auto;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:6px;z-index:6}
 #nav .brand{padding:2px 6px} #nav .brand small,#nav .foot{display:none} #nav .brand b{font-size:18px}
 #nav a.n{white-space:nowrap;padding:8px 10px;font-size:14px}
 header{position:static;padding:8px 12px} header .big{display:none}
 main{padding:12px}
 .cols,.grid{grid-template-columns:1fr}
 body:not(.consulta) #fab{display:block;position:fixed;right:16px;bottom:16px;z-index:20;border-radius:30px;padding:13px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
 .hide-m{display:none}
}
/* ===== celular: barra inferior, cabeçalho compacto, janelas em tela cheia ===== */
#tabbar,#mais,.mbrand{display:none}
@media(max-width:820px){
 #nav{display:none!important}
 body{-webkit-text-size-adjust:100%}
 header{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:8px}
 header input{max-width:none;min-width:0;font-size:16px;padding:9px 12px}
 header .grow{display:none} header #q{flex:1;width:100%}
 .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px} .filters input[type=search]{grid-column:1/-1} .filters select{width:100%;min-width:0}
 .mbrand{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--navy);font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:700;font-size:20px;flex-shrink:0}
 .mbrand img{width:30px;height:26px;object-fit:cover;border-radius:4px;background:var(--navy)}
 #banner{padding-top:env(safe-area-inset-top)} #banner img{max-height:110px}
 main{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
 h1{font-size:25px}
 .top{flex-direction:column;align-items:stretch;gap:10px}
 .top .acts{display:flex;flex-wrap:wrap;gap:6px}
 .top .acts button,.top .acts .btn{padding:8px 11px;font-size:14px}
 .stats{grid-template-columns:repeat(2,1fr);gap:8px}
 .stat{padding:9px 12px} .stat b{font-size:20px} .stat span{font-size:12px}
 .card{padding:12px 14px}
 input,select,textarea{font-size:16px}
 .tabs{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
 #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.25)}
 #tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#EBD6CC;text-decoration:none;font-size:11px;position:relative;padding:5px 0 3px;border-radius:12px;margin:0 2px}
 #tabbar a.on{color:var(--cream);background:rgba(255,255,255,.12)}
 #tabbar .ic{font-size:22px;line-height:1.1}
 #tabbar .badge,#mais .badge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:600}
 #tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
 body:not(.consulta) #fab{right:14px;bottom:calc(76px + env(safe-area-inset-bottom));padding:12px 16px;font-size:15px}
 #mais{position:fixed;inset:0;z-index:40;background:rgba(77,14,19,.45)}
 #mais.on{display:block}
 #mais .sh{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
 #mais .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 #mais .gr a{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 4px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--navy);font-size:13px;position:relative}
 #mais .gr .ic{font-size:24px}
 #mais .gr .badge{position:absolute;top:4px;right:6px;margin:0}
 #mais .pe{margin-top:12px;font-size:12px;color:var(--mut);text-align:center}
 #modal{padding:0}
 .mbox{border-radius:0;min-height:100%;max-width:none;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
 .mhead{position:sticky;top:0;background:#fff;z-index:2;padding:6px 0}
 .mfoot{position:sticky;bottom:0;background:#fff;padding:10px 0 4px}
}
@media print{#nav,header,#fab,.acts,.noprint,.filters,.tabs,button{display:none!important} body{background:#fff} .card,.conv{break-inside:avoid;border-color:#bbb} main{padding:0} .printhead{display:flex!important}}
.printhead{display:none;align-items:center;gap:14px;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.printhead img{width:60px}
</style>
</head>

const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=new Date(s+'T12:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const locISO=s=>{if(typeof s==='string'&&/T\d\d:\d\d.*(Z|[+-]\d\d:?\d\d)$/.test(s)){const d=new Date(s);if(!isNaN(d))return new Date(d.getTime()-3*3600e3).toISOString().slice(0,19)}return s};/* horário de Brasília */
const fd=s=>{if(!s)return'';s=locISO(s);const[y,m,d]=s.slice(0,10).split('-');return`${d}/${m}/${y}`};

function blank(){const d={config:{}};COLS.forEach(c=>d[c]=[]);return d}

const ADD=JSON.parse(document.getElementById('rms-add').textContent);const SEED_VER=Math.max(2,...ADD.map(a=>a.v));
function applyAdd(d,v0){for(const A of ADD){if(v0>=A.v)continue;const has=c=>new Set(d[c].map(x=>x.id));
 ['pessoas','processos','andamentos','prazos','conversas','leads'].forEach(c=>{if(!A[c])return;const ids=has(c);A[c].forEach(x=>{if(!ids.has(x.id))d[c].push({...x,criado:new Date().toISOString()})})});
 for(const[k,s]of Object.entries(A.situacao||{})){const p=d.processos.find(x=>x.id===k);if(p)p.situacao=s}
 for(const[k,o]of Object.entries(A.campos||{})){const p=d.processos.find(x=>x.id===k);if(p)Object.assign(p,o)}
 for(const u of (A.atualizar||[])){const r=(d[u.colecao]||[]).find(x=>x.id===u.id);if(!r)continue;const ok=Object.entries(u.se||{}).every(([k,v])=>(r[k]??'')===v);if(ok)Object.assign(r,u.campos||{})}}}
const DERIVED=['JEF Bauru','Vara Federal de Bauru','JEF Marília','Vara Federal de Marília','JEF Botucatu','JEF Ourinhos','JEF Piracicaba','JEF Campinas','São Paulo (capital)','JEF Jaú'];
function mergeSeed(d){const v0=d.config.seedVer||1;if(v0>=SEED_VER)return d;if(v0<2){
 const ids=new Set(d.pessoas.map(p=>p.id)),nameIdx=new Map(d.pessoas.map(p=>[norm(p.nome),p.id])),remap={};
 for(const p of SEED.pessoas){if(ids.has(p.id)){const e=d.pessoas.find(x=>x.id===p.id);if(e&&e.nome==='INSS')e.nome=p.nome;continue}const ex=nameIdx.get(norm(p.nome));if(ex){remap[p.id]=ex;continue}d.pessoas.push({...p});nameIdx.set(norm(p.nome),p.id)}
 const RM=x=>remap[x]||x,dg=s=>String(s||'').replace(/\D/g,''),byNum=new Map(d.processos.map(p=>[dg(p.numero),p]));let n=0;
 for(const s of SEED.processos){const s2={...s,clienteId:RM(s.clienteId),contrariaId:RM(s.contrariaId)};const ex=d.processos.find(p=>p.id===s.id)||byNum.get(dg(s.numero));
  if(!ex){d.processos.push(s2);n++;continue}
  ['responsavel','advContrario','origem'].forEach(k=>ex[k]=s2[k]);if(ex.valorCausa===''||ex.valorCausa==null)ex.valorCausa=s2.valorCausa;
  if(s2.vara&&(!ex.vara||DERIVED.includes(ex.vara)))ex.vara=s2.vara;

  if(!ex.contrariaId&&s2.contrariaId)ex.contrariaId=s2.contrariaId;
  if(s2.status==='Encerrado'&&(!ex.status||ex.status==='Ativo'))ex.status='Encerrado'}
 mergeSeed.added=n}
 applyAdd(d,v0);d.config.seedVer=SEED_VER;d.config.alterado=new Date().toISOString();if(mergeSeed.added===undefined)mergeSeed.added=0;return d}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=mergeSeed(fixDb(JSON.parse(r)));if(mergeSeed.added!==undefined)localStorage.setItem(KEY,JSON.stringify(d));return d}}catch(e){}const d=mergeSeed(fixDb(JSON.parse(JSON.stringify(SEED))));d.config.criado=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}return d}

function loadInicial(){if(SNAP&&SNAP.db&&!principal()){CONSULTA=true;return mergeSeed(fixDb(JSON.parse(JSON.stringify(SNAP.db))))}return load()}
let db=loadInicial();
function bloqueado(){if(!CONSULTA)return false;alert('Modo consulta: este aparelho só mostra os dados. Para lançar ou alterar, use o DNsis no computador.');render();return true}
function tornarPrincipal(){if(!confirm('Usar ESTE aparelho como o principal do DNsis?\n\nSó faça isso se for o computador do escritório. Lançamentos feitos aqui não aparecem nos outros aparelhos.'))return;marcarPrincipal();CONSULTA=false;localStorage.setItem(KEY,JSON.stringify(db));render();toast('Este aparelho agora é o principal.')}
function save(){if(CONSULTA)return;db.config.alterado=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Não foi possível salvar no navegador: '+e.message)}fileSave()}

/* ---------- arquivo de dados vinculado (Chrome/Edge) ---------- */
const FS=false;
let fileHandle=null,fhPending=null,saveTimer=null;
const idb={open(){return new Promise((res,rej)=>{const r=indexedDB.open('rms_escritorio',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async get(k){const d=await this.open();return new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})},
 async set(k,v){const d=await this.open();return new Promise(res=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res()})}};
function setFstat(){const e=$('#fstat');if(!e)return;e.innerHTML=fileHandle?'💾 salvando em <b>'+esc(fileHandle.name)+'</b>':fhPending?'<a href="javascript:reconectar()">💾 reconectar arquivo</a>':''}
function fileSave(now){if(!fileHandle)return;clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{const w=await fileHandle.createWritable();await w.write(JSON.stringify(db));await w.close();setFstat()}catch(e){$('#fstat').textContent='⚠️ erro ao salvar no arquivo'}},now?0:500)}
async function initFile(){return;try{const h=await idb.get('fh');if(!h)return;const p=await h.queryPermission({mode:'readwrite'});if(p==='granted')await attachFile(h);else{fhPending=h;setFstat();render()}}catch(e){}}
async function reconectar(){if(!fhPending)return;try{const p=await fhPending.requestPermission({mode:'readwrite'});if(p==='granted'){const h=fhPending;fhPending=null;await attachFile(h)}}catch(e){alert(e.message)}}
async function attachFile(h){marcarPrincipal();fileHandle=h;try{const txt=await(await h.getFile()).text();if(txt.trim()){const d=JSON.parse(txt);if(d&&d.pessoas&&(d.config?.alterado||'')>(db.config.alterado||'')){db=mergeSeed(fixDb(d));localStorage.setItem(KEY,JSON.stringify(db))}}}catch(e){}fileSave(true);setFstat();render()}
async function criarArquivo(){if(bloqueado())return;try{const h=await showSaveFilePicker({suggestedName:'dados-escritorio-dnsis.json',types:[{description:'Dados do escritório',accept:{'application/json':['.json']}}]});marcarPrincipal();await idb.set('fh',h);fhPending=null;fileHandle=h;fileSave(true);setFstat();render();toast('Arquivo vinculado: tudo será salvo nele automaticamente.')}catch(e){if(e.name!=='AbortError')alert(e.message)}}
async function abrirArquivo(){if(bloqueado())return;try{const[h]=await showOpenFilePicker({types:[{description:'Dados do escritório',accept:{'application/json':['.json']}}]});const p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')return;const txt=await(await h.getFile()).text();const d=txt.trim()?JSON.parse(txt):null;if(d&&d.pessoas){if(!confirm('Carregar os dados deste arquivo? Os dados atuais deste navegador serão substituídos pelos do arquivo.'))return;db=mergeSeed(fixDb(d));localStorage.setItem(KEY,JSON.stringify(db))}await idb.set('fh',h);fhPending=null;fileHandle=h;fileSave(true);setFstat();render();toast('Arquivo aberto e vinculado.')}catch(e){if(e.name!=='AbortError')alert('Não foi possível abrir: '+e.message)}}
async function desvincular(){fileHandle=null;fhPending=null;await idb.set('fh',null);setFstat();render()}

function pessoaOpts(sel){return'<option value="">—</option>'+[...db.pessoas].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(p=>opt(p.id,sel,p.nome+(p.tipo&&p.tipo!=='Cliente'?' ('+p.tipo+')':''))).join('')}
function procOpts(sel,pid){let a=db.processos.filter(p=>!pid||ehCli(p,pid)||p.contrariaId===pid||p.id===sel);a.sort((x,y)=>nomeP(x.clienteId).localeCompare(nomeP(y.clienteId),'pt-BR'));return'<option value="">—</option>'+a.map(p=>opt(p.id,sel,`${p.numero||'(sem nº)'} — ${nomeP(p.clienteId)}${p.acao?' — '+p.acao:''}`)).join('')}
function filtSel(inp){const s=inp.parentElement.querySelector('select'),q=norm(inp.value);let first=null;for(const o of s.options){const hide=!!(q&&o.value&&!norm(o.text).includes(q));o.hidden=hide;if(!hide&&o.value&&!first)first=o}if(q&&first){s.value=first.value;s.dispatchEvent(new Event('change'))}}
function chipP(id){return`<span class="tag" data-id="${id}" style="padding:4px 8px">${esc(nomeP(id))} <a href="javascript:void 0" onclick="tirarMulti(this)" title="remover">✕</a></span>`}
function multiSet(box,ids){box.querySelector('input[type=hidden]').value=ids.join(',');box.querySelector('.chips').innerHTML=ids.map(chipP).join('')}
function multiIds(box){return box.querySelector('input[type=hidden]').value.split(',').filter(Boolean)}
function addMulti(b){const box=b.closest('.multi'),v=box.querySelector('select').value;if(!v)return;const ids=multiIds(box);if(!ids.includes(v))ids.push(v);multiSet(box,ids);box.querySelector('.filt').value='';filtSel(box.querySelector('.filt'))}
function tirarMulti(a){const box=a.closest('.multi'),id=a.parentElement.dataset.id;multiSet(box,multiIds(box).filter(x=>x!==id))}
function novaMulti(b){if(bloqueado())return;const n=prompt('Nome do cliente:');if(!n||!n.trim())return;const p={id:uid(),nome:n.trim(),tipo:'Cliente',criado:new Date().toISOString()};db.pessoas.push(p);save();document.querySelectorAll('#frm select[data-t=pessoa]').forEach(s=>{const v=s.value;s.innerHTML=pessoaOpts(v)});const box=b.closest('.multi');multiSet(box,[...multiIds(box),p.id]);toast('Pessoa cadastrada.')}
function novaPessoaRapida(k){if(bloqueado())return;const n=prompt('Nome da nova pessoa:');if(!n||!n.trim())return;const p={id:uid(),nome:n.trim(),tipo:k==='contrariaId'?'Parte contrária':'Cliente',criado:new Date().toISOString()};db.pessoas.push(p);save();document.querySelectorAll('#frm select[data-t=pessoa]').forEach(s=>{const v=s.name===k?p.id:s.value;s.innerHTML=pessoaOpts(v)});const s=document.querySelector(`#frm [name=${k}]`);s.dispatchEvent(new Event('change'));toast('Pessoa cadastrada. Complete os dados depois na ficha dela.')}

let curLead=null;
function showModal(h){$('#modal').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML='';curLead=null}

function openForm(title,col,rec,opts={}){if(bloqueado())return;
 const isNew=!rec||!rec.id;rec=Object.assign({},rec||{});
 const schema=(opts.schema||SCHEMA[col]).filter(f=>!(f.newOnly&&!isNew));
 let h=`<div class="mbox"><div class="mhead"><h3>${esc(title)}</h3><button class="x" onclick="closeModal()">×</button></div><form id="frm" class="grid" autocomplete="off">`;
 for(const f of schema){
  let v=rec[f.k];if((v===undefined||v===null)&&f.def!==undefined&&isNew)v=typeof f.def==='function'?f.def():f.def;v=v??'';
  const lab=esc(f.l||f.k)+(f.req?' *':'');
  if(f.t==='check'){h+=`<label class="fld chk ${f.w===2?'w2':''}"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${lab}</label>`;continue}
  h+=`<label class="fld ${f.w===2?'w2':''}"><span>${lab}</span>`;
  if(f.t==='area')h+=`<textarea name="${f.k}" rows="${f.rows||3}">${esc(v)}</textarea>`;
  else if(f.t==='sel')h+=`<select name="${f.k}"><option value="">—</option>${(f.o.includes(v)||!v?f.o:[v,...f.o]).map(o=>opt(o,v)).join('')}</select>`;
  else if(f.t==='pessoa')h+=`<div class="pick"><input class="filt" placeholder="digite para procurar…" oninput="filtSel(this)"><select name="${f.k}" data-t="pessoa">${pessoaOpts(v)}</select><button type="button" onclick="novaPessoaRapida('${f.k}')">+ nova</button></div>`;
  else if(f.t==='pessoas'){const ids=Array.isArray(v)?v:String(v||'').split(',').filter(Boolean);h+=`<div class="pick multi"><input type="hidden" name="${f.k}" value="${esc(ids.join(','))}"><div class="chips" style="display:flex;flex-wrap:wrap;gap:6px;width:100%">${ids.map(chipP).join('')}</div><input class="filt" placeholder="digite para procurar…" oninput="filtSel(this)"><select data-t="pessoa" data-multi="1">${pessoaOpts('')}</select><button type="button" onclick="addMulti(this)">+ adicionar</button><button type="button" onclick="novaMulti(this)">+ nova</button></div>`}
  else if(f.t==='processo')h+=`<div class="pick"><select name="${f.k}" ${f.dep?`data-dep="${f.dep}"`:''}>${procOpts(v)}</select></div>`;
  else if(f.t==='money')h+=`<input name="${f.k}" inputmode="decimal" placeholder="0,00" value="${v===''?'':esc(Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2}))}">`;
  else if(f.t==='list')h+=`<input name="${f.k}" value="${esc(v)}" list="dl_${f.k}" placeholder="digite ou escolha"><datalist id="dl_${f.k}">${uniqVals(col,f.k).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
  else{const ty={date:'date',time:'time',datetime:'datetime-local',number:'number'}[f.t]||'text';h+=`<input type="${ty}" name="${f.k}" value="${esc(v)}" ${ty==='number'?`min="${f.min??1}" max="${f.max??120}" step="any"`:''}>`}
  h+='</label>';
 }
 h+=`<div class="mfoot">${!isNew?`<button type="button" class="danger" onclick="del('${col}','${rec.id}')">Excluir</button><span class="grow"></span>`:''}<button type="button" onclick="closeModal()">Cancelar</button><button class="pri" type="submit">Salvar</button></div></form></div>`;
 const keepLead=curLead;showModal(h);curLead=keepLead;
 const frm=$('#frm');
 frm.querySelectorAll('select[data-dep]').forEach(s=>{const src=frm.elements[s.dataset.dep];const refill=()=>{const cur=s.value;s.innerHTML=procOpts(cur,src.value);if(src.value&&!s.value){const o=[...s.options].filter(o=>o.value);if(o.length===1)s.value=o[0].value}};src.addEventListener('change',refill);refill()});
 setTimeout(()=>{const first=frm.querySelector(isNew&&col==='conversas'&&rec.pessoaId?'textarea[name=resumo]':'input:not([type=hidden]):not(.filt),textarea,select');first&&first.focus()},50);
 frm.onsubmit=e=>{
  e.preventDefault();const virt={};
  for(const f of schema){const el=frm.elements[f.k];if(!el)continue;let v;
   if(f.t==='check')v=el.checked;else if(f.t==='money')v=parseMoney(el.value);else if(f.t==='number')v=Number(el.value)||0;else if(f.t==='pessoas')v=el.value.split(',').filter(x=>x&&x!==frm.elements.clienteId?.value);else v=el.value.trim();
   if(f.req&&(v===''||v===null)){alert('Preencha: '+f.l);el.focus();return}
   if(f.virtual)virt[f.k]=v;else rec[f.k]=v}
  if(col==='honorarios'&&rec.pago&&!rec.dataPagamento)rec.dataPagamento=todayStr();
  if(col==='honorarios'&&!rec.pago)rec.dataPagamento='';
  let store=true;if(HOOKS[col])store=HOOKS[col](rec,isNew,virt)!==false;
  if(store){if(isNew){rec.id=uid();rec.criado=new Date().toISOString();db[col].push(rec)}else{const i=db[col].findIndex(x=>x.id===rec.id);db[col][i]=rec}}
  if(HOOKS[col+'_after'])HOOKS[col+'_after'](rec,isNew,virt);
  save();const L=curLead;closeModal();
  if(opts.after)opts.after(rec);else if(isNew&&col==='processos')go('processo/'+rec.id);else if(isNew&&col==='pessoas'&&!opts.stay)go('pessoa/'+rec.id);else render();
  if(L&&byId('leads',L))verLead(L);
  toast('Salvo.');
 };
}
const procAtivo=p=>['Ativo','Suspenso'].includes(p.status||'Ativo');
const RX_ENC=/baixa definitiva|baixado definitivamente|arquivamento definitivo|arquivado definitivamente|arquivados? os autos|remetidos? ao arquivo|processo encerrado|feito encerrado|extin[cç][aã]o da execu[cç][aã]o.*tr[aâ]nsit/i;
function pareceEncerrado(p){const a=db.andamentos.filter(x=>x.processoId===p.id).sort(by('data','criado')).reverse()[0];if(a&&RX_ENC.test(a.descricao||''))return{txt:a.descricao,data:a.data};if(RX_ENC.test(p.situacao||''))return{txt:p.situacao,data:''};return null}
function encerrarProc(id){const p=byId('processos',id);if(!p)return;const b=pareceEncerrado(p);
 openForm('Encerrar / arquivar processo','processos',{...p,status:'Arquivado',dataEncerramento:(b&&b.data)||todayStr()},{schema:[{k:'status',l:'Como terminou',t:'sel',o:OPT.statusProc.filter(o=>!['Ativo','Suspenso'].includes(o)),req:1},{k:'dataEncerramento',l:'Data de encerramento',t:'date',req:1},{k:'situacao',l:'Situação atual (resumo para o cliente)',t:'area',w:2,rows:3}]})}
function encerrarTodos(){if(bloqueado())return;const L=db.processos.filter(p=>procAtivo(p)&&pareceEncerrado(p));if(!L.length)return;if(!confirm(`Marcar ${L.length} processo(s) como Arquivado, com a data do andamento de baixa/arquivamento?\n\nConfira a lista antes, se preferir (botão Ver a lista).`))return;const ag=new Date().toISOString();L.forEach(p=>{const b=pareceEncerrado(p);p.status='Arquivado';p.dataEncerramento=(b&&b.data)||todayStr();p._m=ag});save();render();toast(L.length+' processo(s) arquivado(s).')}
function reabrirProc(id){if(bloqueado())return;const p=byId('processos',id);if(!p||!confirm('Reabrir este processo (voltar para Ativo)?'))return;p.status='Ativo';p.dataEncerramento='';p._m=new Date().toISOString();save();render();toast('Processo reaberto.')}
function uniqVals(col,k){return[...new Set((db[col]||[]).map(x=>x[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'))}

 processos(rec,isNew){if(rec.status&&!['Ativo','Suspenso'].includes(rec.status)&&!rec.dataEncerramento)rec.dataEncerramento=todayStr();if(['Ativo','Suspenso'].includes(rec.status||'Ativo'))rec.dataEncerramento='';if(rec.parceriaPct==='0'||rec.parceriaPct===0)rec.parceriaPct=''},

 for(const p of a){const d=p.data.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+p.id+'@dnsis-escritorio','DTSTAMP:'+stamp);if(p.hora){const[hh,mm]=p.hora.split(':');const end=pad((+hh+1)%24)+mm;L.push(`DTSTART:${d}T${hh}${mm}00`,`DTEND:${d}T${end}00`)}else L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addDays(p.data,1).replace(/-/g,''));

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function pkce() {
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const c = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  return { v, c };
}
const iosStandalone = () => window.navigator.standalone === true;
async function entrarDropbox(modoCodigo) {

  const { v, c } = await pkce();
  localStorage.setItem(DBX_VER, v);
  const p = new URLSearchParams({ client_id: DBX_APP_KEY, response_type: 'code', code_challenge: c, code_challenge_method: 'S256', token_access_type: 'offline' });
  p.set('redirect_uri', REDIRECT);
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + p;
}

async function trocarCodigo(code, comRedirect) {
  const body = new URLSearchParams({ code, grant_type: 'authorization_code', client_id: DBX_APP_KEY, code_verifier: localStorage.getItem(DBX_VER) || '' });
  if (comRedirect) body.set('redirect_uri', REDIRECT);
  try {
    const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body });
    const j = await r.json();
    if (!r.ok || !j.access_token) throw new Error(j.error_description || j.error || ('HTTP ' + r.status));
    dbx = { refresh: j.refresh_token, access: j.access_token, exp: Date.now() + (j.expires_in - 60) * 1000, conta: j.account_id };
    localStorage.setItem(DBX_TOK, JSON.stringify(dbx));
    localStorage.removeItem(DBX_VER); localStorage.removeItem(DBX_URL);
    toast('Dropbox conectado. Sincronizando…');
    await sincronizar(true);
    render();
  } catch (e) { alert('Não foi possível conectar ao Dropbox: ' + e.message) }
}
async function tokenValido() {
  if (!dbx) throw new Error('desconectado');
  if (dbx.access && dbx.exp > Date.now()) return dbx.access;
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: dbx.refresh, client_id: DBX_APP_KEY }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 400 || r.status === 401) { sairDropbox(true) } throw new Error(j.error_description || 'falha ao renovar acesso') }
  dbx.access = j.access_token; dbx.exp = Date.now() + (j.expires_in - 60) * 1000;
  localStorage.setItem(DBX_TOK, JSON.stringify(dbx));
  return dbx.access;
}
function sairDropbox(silencioso) {

const argHeader = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => '\\u' + ('000' + c.charCodeAt(0).toString(16)).slice(-4));
async function dbxApi(rota, corpo) {
  const t = await tokenValido();
  const r = await fetch('https://api.dropboxapi.com/2/' + rota, { method: 'POST', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  if (r.status === 409) { const j = await r.json().catch(() => ({})); const e = new Error(j.error_summary || 'conflito'); e.code = 409; e.summary = j.error_summary || ''; throw e }
  if (!r.ok) throw new Error(rota + ': HTTP ' + r.status);
  return r.json();
}
async function dbxBaixar(caminho) {
  const t = await tokenValido();
  const r = await fetch('https://content.dropboxapi.com/2/files/download', { method: 'POST', headers: { Authorization: 'Bearer ' + t, 'Dropbox-API-Arg': argHeader({ path: caminho }) } });
  if (r.status === 409) return null;
  if (!r.ok) throw new Error('download: HTTP ' + r.status);
  const meta = JSON.parse(r.headers.get('Dropbox-API-Result') || '{}');
  return { texto: await r.text(), rev: meta.rev };
}
async function dbxEnviar(caminho, texto, rev) {
  const t = await tokenValido();
  const modo = rev ? { '.tag': 'update', update: rev } : { '.tag': 'add' };
  const r = await fetch('https://content.dropboxapi.com/2/files/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/octet-stream', 'Dropbox-API-Arg': argHeader({ path: caminho, mode: modo, autorename: false, mute: true }) }, body: new Blob([texto], { type: 'application/octet-stream' }) });

function marcarAlteracoes(d) {

  COLS.forEach(c => d[c].forEach(r => {
    const k = c + ':' + r.id; vistos.add(k);
    const j = semM(r);

}

/* ---------- ciclo de sincronização ---------- */

async function sincronizar(forcarRender) {
  if (!dbx) return;
  if (syncRodando) { syncDeNovo = true; return }
  syncRodando = true; syncState.status = 'sincronizando'; mostrarSync();
  try {
    for (let tentativa = 0; tentativa < 4; tentativa++) {
      const remoto = await dbxBaixar('/dados.json');
      const rem = remoto ? fixDb(JSON.parse(remoto.texto)) : null;
      marcarAlteracoes(db);
      let m = mesclar(db, rem);
      // pacotes da caixa de entrada
      let lista = [];
      try { const j = await dbxApi('files/list_folder', { path: '/entrada' }); lista = j.entries.filter(e => e['.tag'] === 'file' && e.name.endsWith('.json')).map(e => e.name).sort() } catch (e) { if (e.code !== 409) throw e }
      const aplicados = new Set(m.config.pacotesAplicados || []);
      let novos = 0;
      for (const nome of lista) {
        if (aplicados.has(nome)) continue;
        const f = await dbxBaixar('/entrada/' + nome);
        if (!f) continue;
        try { aplicarPacote(m, JSON.parse(f.texto), nome); novos++ } catch (e) { console.warn('pacote inválido', nome, e) }
      }
      const texto = JSON.stringify(m);
      const mudouRemoto = !remoto || texto !== JSON.stringify(rem);
      if (mudouRemoto) {
        m.config.alterado = new Date().toISOString();
        try { await dbxEnviar('/dados.json', JSON.stringify(m), remoto && remoto.rev) }
        catch (e) { if (e.code === 409) continue; throw e }
      }
      const mudouLocal = JSON.stringify(db) !== JSON.stringify(m);
      db = m; fotografar(db);
      try { localStorage.setItem(KEY, JSON.stringify(db)) } catch (e) { }
      await backupDiario(texto);
      syncState = { status: 'ok', ultima: new Date(), erro: '' };
      if (novos) toast(novos + ' lançamento(s) novo(s) recebido(s).');
      if (mudouLocal || forcarRender) { const ativo = document.activeElement; if (!$('#modal').classList.contains('on') && !(ativo && /INPUT|TEXTAREA/.test(ativo.tagName))) render() }
      break;
    }
  } catch (e) {
    syncState.status = (navigator.onLine === false || e instanceof TypeError) ? 'offline' : 'erro'; syncState.erro = e.message;
  } finally {
    syncRodando = false; mostrarSync();
    if (syncDeNovo) { syncDeNovo = false; agendarSync(300) }
  }
}
async function backupDiario(texto) {
  const hoje = todayStr();
  if (localStorage.getItem('erms_bk') === hoje) return;
  if (!db.processos.length && !db.pessoas.length) return;   // nunca guardar cópia vazia
  const cam = '/backups/dados-' + hoje + '.json';
  try {
    await dbxEnviar(cam, texto, null);
  } catch (e) {
    if (e.code !== 409) return;   // 409 = já existe cópia de hoje (outro aparelho)
    try {   // se a cópia de hoje estiver vazia (aparelho ainda sem dados), substitui
      const m = await dbxApi('files/get_metadata', { path: cam });
      if (m.size < 2000) await dbxEnviar(cam, texto, m.rev); else { }
    } catch (e2) { return }
  }
  localStorage.setItem('erms_bk', hoje);
  try {
    const j = await dbxApi('files/list_folder', { path: '/backups' });
    const velhos = j.entries.filter(e => /^dados-\d{4}-\d{2}-\d{2}\.json$/.test(e.name)).map(e => e.name).sort().slice(0, -30);
    for (const n of velhos) await dbxApi('files/delete_v2', { path: '/backups/' + n });

}

function lerImagem(f) {
  return new Promise((ok, erro) => {
    const r = new FileReader(); r.onerror = () => erro(new Error('não consegui ler a imagem'));
    r.onload = () => {
      const img = new Image(); img.onerror = () => erro(new Error('formato de imagem não suportado'));
      img.onload = () => {
        const max = 1800, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  });
}

  return base + ` Trata-se de um PRAZO ou COMPROMISSO. Regras:
- Intimação/publicação com prazo a contar: tipo "Prazo", "data" vazia, informe data_disponibilizacao e/ou data_publicacao e dias_uteis; o DNsis calcula a data final. Use o prazo fixado no ato; se não houver, o legal: recurso inominado (JEF/JEC) 10; apelação, agravo de instrumento, contrarrazões, contestação/réplica e manifestação sobre laudo 15; embargos de declaração 5; ato sem prazo expresso 5 (CPC 218 §3º); Justiça do Trabalho: recurso ordinário e contrarrazões 8, embargos 5. Prazos do processo eletrônico em dias úteis.
- Se o material trouxer a data final expressa ("até 20/11"), preencha "data" com ela.
- Audiência, perícia, reunião: tipo correspondente, data e hora do ato, local e o que o cliente deve levar nos obs.
- Intimação pelo portal sem data de ciência clara: deixe data_publicacao vazia e explique em alertas.
- Em obs, explique a contagem (ato, publicação, fundamento) de forma objetiva.`;
}

async function iaChamar(col, texto, imagens) {
  const chave = iaChave(); if (!chave) throw new Error('Cadastre a chave da API do Claude em Backup e ajustes.');
  const content = imagens.map(b => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b } }));
  content.push({ type: 'text', text: (texto || '').trim() || '(sem texto; use as imagens)' });
  const tool = IA_TOOLS[col];
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': chave, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: IA_MODELO, max_tokens: 8000, system: iaSistema(col) + `\n\nResponda SEMPRE chamando a ferramenta ${tool.name}, uma única vez, sem texto adicional.`, tools: [tool], tool_choice: { type: 'auto' }, messages: [{ role: 'user', content }] })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = (j.error && j.error.message) || ('HTTP ' + r.status);
    if (r.status === 401) throw new Error('chave da API inválida. Confira em Backup e ajustes.');
    if (/credit|balance/i.test(m)) throw new Error('sem créditos na conta da API (console.anthropic.com → Billing).');
    throw new Error(m);
  }
  const u = (j.content || []).find(c => c.type === 'tool_use');
  if (u) return u.input;
  // reserva: se o modelo respondeu em texto, tenta achar um JSON na resposta
  const txt = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
  const m = txt.match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]) } catch (e) { } }
  throw new Error('a IA não devolveu os dados. Tente de novo.');
}

/* ---------- localizar processo / cliente no DNsis ---------- */
function iaAcharProcesso(numero) {
  const d = String(numero || '').replace(/\D/g, ''); if (d.length < 15) return null;
  return db.processos.find(p => String(p.numero || '').replace(/\D/g, '') === d) || null;
}
function iaAcharPessoa(nome) {
  const n = norm(nome).trim(); if (n.length < 4) return null;
  const ex = db.pessoas.filter(p => norm(p.nome) === n); if (ex.length === 1) return ex[0];
  const c = db.pessoas.filter(p => norm(p.nome).includes(n) || (n.includes(norm(p.nome)) && norm(p.nome).length > 8));
  return c.length === 1 ? c[0] : null;
}

function iaMontar(col, x) {
  const avisos = [], rec = {};
  if (x.alertas) avisos.push(x.alertas);
  if (col === 'leads') {
    Object.assign(rec, { nome: x.nome || '', telefone: x.telefone || '', email: x.email || '', origem: x.origem || '', area: x.area || '', assunto: x.assunto || '', etapa: 'Novo', obs: x.obs || '' });
    if (x.proximo_contato) rec.proximoContato = x.proximo_contato;
    if (x.valor) rec.valor = x.valor;
    const tel = String(x.telefone || '').replace(/\D/g, '').slice(-8);
    const ja = tel && [...db.leads, ...db.pessoas].find(p => String(p.telefone || '').replace(/\D/g, '').slice(-8) === tel);
    const jaNome = !ja && iaAcharPessoa(x.nome);
    if (ja || jaNome) avisos.push(`Já existe no DNsis alguém com ${ja ? 'este telefone' : 'este nome'}: ${(ja || jaNome).nome}. Confira se não é duplicado${db.pessoas.includes(ja || jaNome) ? ' (é cliente cadastrado)' : ''}.`);
    return { rec, avisos };
  }
  const proc = iaAcharProcesso(x.numero_processo);
  const pes = proc ? byId('pessoas', proc.clienteId) : iaAcharPessoa(x.cliente);
  if (x.numero_processo && !proc) avisos.push(`O processo ${x.numero_processo} não está cadastrado no DNsis.`);
  if (!proc && x.cliente && !pes) avisos.push(`Não encontrei o cliente "${x.cliente}" no DNsis: escolha no campo Cliente.`);
  Object.assign(rec, { tipo: x.tipo || 'Prazo', titulo: x.titulo || '', hora: x.hora || '', local: x.local || '', processoId: proc ? proc.id : '', pessoaId: pes ? pes.id : '', obs: x.obs || '' });
  let contagem = '';
  if (x.data) rec.data = x.data;
  else if (x.dias_uteis > 0 && (x.data_publicacao || x.data_disponibilizacao)) {
    const j = x.justica || justicaNum(proc ? proc.numero : x.numero_processo) || 'federal';
    const pub = x.data_publicacao || isoD(proxUtil(parseD(x.data_disponibilizacao), j));
    rec.data = prazoFinal(pub, x.dias_uteis, j);
    contagem = `Contagem do DNsis: ${x.data_disponibilizacao ? 'disponibilizado em ' + fd(x.data_disponibilizacao) + ', ' : ''}publicação/ciência em ${fd(pub)}; início em ${fd(isoD(proxUtil(parseD(pub), j)))}; ${x.dias_uteis} dias úteis (Justiça ${j}, feriados nacionais${j === 'federal' ? ', da Justiça Federal' : j === 'estadual' ? ', de SP' : ''} e recesso de 20/12 a 20/01) → prazo final ${fd(rec.data)}. Feriados municipais da comarca não estão incluídos.`;
  } else if (rec.tipo === 'Prazo') {
    rec.data = todayStr(); avisos.push('Não deu para calcular a data final (falta a data de publicação ou o número de dias). Deixei HOJE: corrija a data.');
  }
  if (rec.tipo === 'Prazo' && !/^⚠/.test(rec.titulo)) rec.titulo = '⚠ conferir – ' + rec.titulo;
  rec.obs = [rec.obs, contagem, 'Preenchido com IA – conferir antes de cumprir.'].filter(Boolean).join('\n\n');
  return { rec, avisos };
}

/* ---------- caixa "Preencher com IA" nos formulários de Novo lead / Novo prazo ---------- */
const _openFormBase = openForm;
openForm = function (title, col, rec, opts = {}) {
  _openFormBase(title, col, rec, opts);
  if (!['leads', 'prazos'].includes(col) || (rec && rec.id)) return;
  const frm = $('#frm'); if (!frm) return;
  const box = document.createElement('div'); box.className = 'w2'; box.id = 'iabox';
  box.style.cssText = 'grid-column:1/-1;background:#f3ecdf;border:1px solid #e2d6bf;border-radius:10px;padding:10px 12px;margin-bottom:4px';
  box.innerHTML = opts.iaAvisos !== undefined
    ? `<b>✨ Preenchido com IA – confira tudo antes de salvar.</b>${opts.iaAvisos.length ? '<ul style="margin:6px 0 0 18px;padding:0">' + opts.iaAvisos.map(a => `<li>${esc(a)}</li>`).join('') + '</ul>' : ''}`
    : `<b>✨ Preencher com IA</b> <span class="sub">– cole o texto e/ou envie prints; a IA preenche o formulário para você conferir.</span>
      <textarea id="iaTxt" rows="3" style="width:100%;margin-top:6px;box-sizing:border-box" placeholder="${col === 'leads' ? 'Cole aqui a mensagem do WhatsApp, e-mail…' : 'Cole aqui a intimação, publicação, despacho…'}"></textarea>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">
        <label class="btn" style="cursor:pointer">📷 Imagens / prints<input id="iaImg" type="file" accept="image/*" multiple style="display:none" onchange="$('#iaQt').textContent=this.files.length?this.files.length+' imagem(ns)':''"></label>
        <span id="iaQt" class="sub"></span><span class="grow" style="flex:1"></span>
        <button type="button" class="pri" id="iaBtn" onclick="iaPreencher('${col}')">✨ Preencher</button>
      </div><div id="iaSt" class="sub" style="margin-top:4px"></div>`;
  frm.insertBefore(box, frm.firstChild);
};
async function iaPreencher(col) {
  const st = $('#iaSt'), bt = $('#iaBtn');
  if (!iaChave()) { st.innerHTML = 'Primeiro cadastre a chave da API em <a href="#config" onclick="closeModal()">Backup e ajustes</a>.'; return }
  const texto = $('#iaTxt').value, fs = [...($('#iaImg').files || [])].slice(0, 5);
  if (!texto.trim() && !fs.length) { st.textContent = 'Cole um texto ou escolha uma imagem.'; return }
  if (!navigator.onLine) { st.textContent = 'Sem internet: a IA precisa de conexão.'; return }
  bt.disabled = true; st.textContent = '⏳ Lendo' + (fs.length ? ' as imagens' : '') + '…';
  try {
    const imgs = []; for (const f of fs) imgs.push(await lerImagem(f));
    st.textContent = '⏳ A IA está analisando…';
    const x = await iaChamar(col, texto, imgs);
    const { rec, avisos } = iaMontar(col, x);
    closeModal();
    openForm(NOVO[col] + ' (IA)', col, rec, { iaAvisos: avisos });
  } catch (e) { st.textContent = '⚠️ ' + e.message; bt.disabled = false }
}

${iaChave() ? `<p>Chave cadastrada: <b>…${esc(iaChave().slice(-6))}</b></p><div class="acts"><button onclick="iaTestar()">Testar</button><button onclick="if(confirm('Remover a chave deste aparelho?')){localStorage.removeItem(IA_KEY);render()}">Remover</button></div>`
  : `<div class="acts"><input id="iaKeyIn" type="password" placeholder="sk-ant-…" autocomplete="off" style="flex:1;min-width:220px"><button class="pri" onclick="const v=$('#iaKeyIn').value.trim();if(!/^sk-ant-/.test(v)){alert('A chave começa com sk-ant-');return}localStorage.setItem(IA_KEY,v);render();iaTestar()">Salvar</button></div>`}
<div id="iaTst" class="sub" style="margin-top:6px"></div></div>`;
async function iaTestar() {
  const o = $('#iaTst'); if (o) o.textContent = '⏳ testando…';
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': iaChave(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: IA_MODELO, max_tokens: 5, messages: [{ role: 'user', content: 'Responda só: ok' }] }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 401 ? 'chave inválida' : ((j.error && j.error.message) || 'HTTP ' + r.status));
    if (o) o.innerHTML = '✅ Funcionando.';
  } catch (e) { if (o) o.textContent = '⚠️ ' + e.message }
}
