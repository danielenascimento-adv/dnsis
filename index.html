<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DNsis</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4D0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DNsis">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--navy:#4D0E13;--blue:#6D2932;--sky:#C48A6E;--cream:#F3E2D6;--bg:#F7F2EC;--card:#fff;--ink:#2B1A1C;--mut:#76605F;--line:#E8DDD2;--acc:#6D2932;--ok:#1f7a48;--warn:#b7740c;--bad:#b3362b;--soft:#F5E9E4}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.serif,h1{font-family:"Cormorant Garamond",Garamond,"Times New Roman",Georgia,serif}
#app{display:flex;min-height:100vh}
#nav{width:220px;background:var(--navy);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
#nav .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:var(--cream);text-decoration:none}
#nav .brand img{width:46px;height:40px;object-fit:cover;border-radius:4px}
#nav .brand b{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-size:24px;letter-spacing:2px;line-height:1.1;font-weight:600;letter-spacing:.3px}
#nav .brand small{display:block;font-size:10px;letter-spacing:.8px;font-family:system-ui,sans-serif;font-weight:400;color:var(--sky);text-transform:none;white-space:nowrap}
#nav a.n{color:#EBD6CC;text-decoration:none;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;margin-bottom:2px}
#nav a.n:hover{background:rgba(255,255,255,.07)}
#nav a.n.on{background:var(--cream);color:var(--navy);font-weight:600}
#nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
#nav .foot{margin-top:auto;font-size:11px;color:#C9A39A;padding:10px}
.ico{display:block;width:20px;height:20px;flex:none}
.ie{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.2em;flex:none}
h2 .ie{color:var(--sky);margin-right:2px}
#nav a.n .ico{color:#E2B094}
#nav a.n.on .ico{color:var(--navy)}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#banner{background:#4D0E13;line-height:0}#banner img{width:100%;height:auto;display:block;max-height:240px;object-fit:cover;object-position:left center}
header{display:flex;gap:10px;align-items:center;padding:10px 20px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header input{flex:1;max-width:480px}
main{padding:20px;max-width:1200px;width:100%}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cdd3dc;border-radius:8px;background:#fff;color:inherit;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:-1px}
button,.btn{font:inherit;cursor:pointer;border:1px solid #cdd3dc;background:#fff;border-radius:8px;padding:7px 13px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--sky)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.big{background:var(--navy);border-color:var(--navy);color:var(--cream);font-weight:600}
button.danger{color:var(--bad)}
button.ic{border:none;background:none;padding:4px 6px;color:var(--mut)}
button.ic:hover{color:var(--ink)}
h1{font-size:28px;margin:0 0 2px;font-weight:600;color:var(--navy)}
h2{font-size:16px;margin:0 0 10px;color:var(--navy)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat span{color:var(--mut);font-size:13px}
.stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex-shrink:0}
.grow{flex:1;min-width:0}
.sub{color:var(--mut);font-size:13px}
.late{box-shadow:inset 4px 0 0 var(--bad);padding-left:12px}
.today{box-shadow:inset 4px 0 0 var(--warn);padding-left:12px}
.soon{box-shadow:inset 4px 0 0 #e2c35e;padding-left:12px}
.rel{font-size:12px;color:var(--mut);white-space:nowrap}
.late .rel{color:var(--bad);font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--blue);font-weight:600;vertical-align:1px}
.tag.g{background:#e2f2e8;color:var(--ok)} .tag.r{background:#f9e5e3;color:var(--bad)} .tag.y{background:#fbf0d8;color:var(--warn)} .tag.n{background:#eceef1;color:var(--mut)}
a{color:var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters>*{width:auto;flex:0 1 auto}
.filters input[type=search]{flex:1 1 240px}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.row:last-child{border-bottom:none}
.row:hover{background:#faf8f3}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.empty{color:var(--mut);padding:18px;text-align:center}
.conv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.conv .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.conv .txt{white-space:pre-wrap;margin:6px 0}
.nx{background:#fbf5e4;border-radius:8px;padding:6px 10px;font-size:14px;white-space:pre-wrap}
.day{font-weight:700;color:var(--mut);font-size:13px;margin:16px 0 6px}
.day:first-letter{text-transform:uppercase}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 12px;color:var(--mut)}
.tabs button.on{border-color:var(--blue);color:var(--ink);font-weight:600}
dl.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:0}
dl.info dt{font-size:12px;color:var(--mut)} dl.info dd{margin:0;white-space:pre-wrap;word-break:break-word}
.situ{background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:#ebe6da;border-radius:12px;padding:10px;min-height:120px}
.kcol h3{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between;color:var(--navy)}
.kcard{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kcard select{margin-top:6px;padding:4px 6px;font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;background:#faf8f3}
.num{text-align:right;white-space:nowrap}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:auto}
#modal{position:fixed;inset:0;background:rgba(77,14,19,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 12px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:700px;padding:18px 20px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mhead h3{margin:0;color:var(--navy)}
.x{border:none!important;font-size:26px;line-height:1;padding:0 6px;background:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.fld.w2{grid-column:1/-1}
.fld.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.fld.chk input{width:auto}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick .filt{flex:1 1 100%}
.pick select{flex:1;min-width:0}
.mfoot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#fab{display:none}
.consulta .acts .big,.consulta .acts .pri,.consulta header .big{display:none!important}
.banner{background:#fbf5e4;border:1px solid #ecd9a6;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;background:var(--sky);border-radius:4px 4px 0 0;min-height:2px}
.bars div.cur i{background:var(--blue)}
.cartao{max-width:640px;width:100%;border-radius:14px;box-shadow:0 8px 30px rgba(77,14,19,.25);display:block}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 18px;border-radius:10px;z-index:99;display:none}
@media(max-width:820px){
 #app{flex-direction:column}
 #nav{width:auto;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:6px;z-index:6}
 #nav .brand{padding:2px 6px} #nav .brand small,#nav .foot{display:none} #nav .brand b{font-size:18px}
 #nav a.n{white-space:nowrap;padding:8px 10px;font-size:14px}
 header{position:static;padding:8px 12px} header .big{display:none}
 main{padding:12px}
 .cols,.grid{grid-template-columns:1fr}
 body:not(.consulta) #fab{display:block;position:fixed;right:16px;bottom:16px;z-index:20;border-radius:30px;padding:13px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
 .hide-m{display:none}
}
/* ===== celular: barra inferior, cabeçalho compacto, janelas em tela cheia ===== */
#tabbar,#mais,.mbrand{display:none}
@media(max-width:820px){
 #nav{display:none!important}
 body{-webkit-text-size-adjust:100%}
 header{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:8px}
 header input{max-width:none;min-width:0;font-size:16px;padding:9px 12px}
 header .grow{display:none} header #q{flex:1;width:100%}
 .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px} .filters input[type=search]{grid-column:1/-1} .filters select{width:100%;min-width:0}
 .mbrand{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--navy);font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:700;font-size:20px;flex-shrink:0}
 .mbrand img{width:30px;height:26px;object-fit:cover;border-radius:4px;background:var(--navy)}
 #banner{padding-top:env(safe-area-inset-top)} #banner img{max-height:110px}
 main{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
 h1{font-size:25px}
 .top{flex-direction:column;align-items:stretch;gap:10px}
 .top .acts{display:flex;flex-wrap:wrap;gap:6px}
 .top .acts button,.top .acts .btn{padding:8px 11px;font-size:14px}
 .stats{grid-template-columns:repeat(2,1fr);gap:8px}
 .stat{padding:9px 12px} .stat b{font-size:20px} .stat span{font-size:12px}
 .card{padding:12px 14px}
 input,select,textarea{font-size:16px}
 .tabs{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
 #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.25)}
 #tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#EBD6CC;text-decoration:none;font-size:11px;position:relative;padding:5px 0 3px;border-radius:12px;margin:0 2px}
 #tabbar a.on{color:var(--cream);background:rgba(255,255,255,.12)}
 #tabbar .ic{font-size:22px;line-height:1.1}
#tabbar .ico{width:23px;height:23px}
#mais .gr .ico{width:25px;height:25px;color:var(--blue)}
 #tabbar .badge,#mais .badge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:600}
 #tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
 body:not(.consulta) #fab{right:14px;bottom:calc(76px + env(safe-area-inset-bottom));padding:12px 16px;font-size:15px}
 #mais{position:fixed;inset:0;z-index:40;background:rgba(77,14,19,.45)}
 #mais.on{display:block}
 #mais .sh{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
 #mais .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 #mais .gr a{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 4px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--navy);font-size:13px;position:relative}
 #mais .gr .ic{font-size:24px}
 #mais .gr .badge{position:absolute;top:4px;right:6px;margin:0}
 #mais .pe{margin-top:12px;font-size:12px;color:var(--mut);text-align:center}
 #modal{padding:0}
 .mbox{border-radius:0;min-height:100%;max-width:none;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
 .mhead{position:sticky;top:0;background:#fff;z-index:2;padding:6px 0}
 .mfoot{position:sticky;bottom:0;background:#fff;padding:10px 0 4px}
}
@media print{#nav,header,#fab,.acts,.noprint,.filters,.tabs,button{display:none!important} body{background:#fff} .card,.conv{break-inside:avoid;border-color:#bbb} main{padding:0} .printhead{display:flex!important}}
.printhead{display:none;align-items:center;gap:14px;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.printhead img{width:60px}
</style>
</head>

 openForm('Encerrar / arquivar processo','processos',{...p,status:'Arquivado',dataEncerramento:(b&&b.data)||todayStr()},{schema:[{k:'status',l:'Como terminou',t:'sel',o:OPT.statusProc.filter(o=>!['Ativo','Suspenso'].includes(o)),req:1},{k:'dataEncerramento',l:'Data de encerramento',t:'date',req:1},{k:'situacao',l:'Situação atual (resumo para o cliente)',t:'area',w:2,rows:3}]})}

 honorarios(rec,isNew,v){const n=Math.max(1,Math.min(120,v._parcelas||1));if(!isNew||n<=1)return;const tot=Math.round(rec.valor*100),base=Math.floor(tot/n),g=uid();for(let i=0;i<n;i++){const val=(i===n-1?tot-base*(n-1):base)/100;db.honorarios.push({...rec,id:uid(),criado:new Date().toISOString(),grupo:g,valor:val,vencimento:addMonths(rec.vencimento,i),descricao:(rec.descricao||rec.tipo||'Honorários')+` (parcela ${i+1}/${n})`,pago:i===0?rec.pago:false,dataPagamento:i===0?rec.dataPagamento:''})}return false},

 else if(!confirm('Excluir este registro?'))return;
 db[col]=db[col].filter(x=>x.id!==id);save();const L=col==='leads'?null:curLead;closeModal();

function backupBanner(){if(CONSULTA)return'';if(fileHandle)return'';if(fhPending)return`<div class="banner"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg> Seu arquivo de dados precisa ser reconectado. <button class="pri" onclick="reconectar()">Reconectar</button></div>`;const u=db.config.ultimoBackup;if(!u||u<addDays(todayStr(),-7))return`<div class="banner"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m5.6 5.6 3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg> ${u?'Último backup em '+fd(u)+'.':'Nenhum backup feito ainda.'} Os dados ficam só neste navegador — ${FS?'vincule um arquivo (salva sozinho) ou ':''}baixe uma cópia. ${FS?'<button class="pri" onclick="criarArquivo()">Vincular arquivo</button>':''}<button onclick="exportar()">Baixar backup</button></div>`;return''}
VIEWS.painel=()=>{
 const t=todayStr(),w=addDays(t,7),m=t.slice(0,7);
 const pz=db.prazos.filter(p=>!p.feito&&p.data&&p.data<=w).sort(by('data','hora'));
 const rtAll=db.conversas.filter(c=>c.pessoaId&&c.retorno&&!c.retornoFeito);const rt=rtAll.filter(c=>c.retorno<=w).sort(by('retorno'));
 const ld=db.leads.filter(l=>aberto(l)&&l.proximoContato&&l.proximoContato<=w).sort(by('proximoContato'));
 const hp=db.honorarios.filter(h=>!h.pago),atras=hp.filter(h=>h.vencimento<t),prox=hp.filter(h=>h.vencimento>=t&&h.vencimento<=addDays(t,30));
 const recMes=db.honorarios.filter(h=>h.pago&&(h.dataPagamento||'').startsWith(m));
 const ult=[...db.conversas].filter(c=>c.pessoaId).sort(by('dataHora')).reverse().slice(0,4);
 const novid=db.andamentos.filter(a=>a.data>=addDays(t,-7)).sort(by('data')).reverse();
 const ativos=db.processos.filter(p=>!p.status||p.status==='Ativo'||p.status==='Suspenso').length;
 let h=`<div class="top"><div><h1>${saud()}</h1><div class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><div class="acts"><button class="big" onclick="novo('conversas')"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.3A8 8 0 1 1 21 12z"/></svg> Registrar conversa</button><button onclick="novo('prazos')"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> Novo prazo</button><button onclick="novo('leads')"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg> Novo lead</button></div></div>`;
 h+=backupBanner();
 h+=`<div class="stats"><div class="stat" onclick="go('processos')"><b>${ativos}</b><span>Processos ativos</span></div><div class="stat ${db.prazos.some(p=>!p.feito&&p.data<t)?'bad':''}" onclick="go('prazos')"><b>${db.prazos.filter(p=>!p.feito&&p.data<=w).length}</b><span>Prazos até 7 dias</span></div><div class="stat ${rtAll.some(c=>c.retorno<t)?'bad':''}" onclick="st.cr='p';go('conversas')"><b>${rtAll.length}</b><span>Retornos a clientes</span></div><div class="stat" onclick="go('leads')"><b>${db.leads.filter(aberto).length}</b><span>Leads em aberto</span></div><div class="stat ok" onclick="go('honorarios')"><b>${money(sum(recMes))}</b><span>Recebido no mês</span></div><div class="stat ${atras.length?'bad':''}" onclick="st.hs='atr';go('honorarios')"><b>${money(sum(atras))}</b><span>Honorários em atraso</span></div></div>`;
 h+=`<div class="cols"><div class="card"><h2><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> Prazos e compromissos (atrasados e próximos 7 dias)</h2>${pz.map(prazoItem).join('')||'<div class="empty">Nada pendente nos próximos 7 dias.</div>'}</div><div class="card"><h2><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg> Retornos prometidos a clientes</h2>${rt.map(retornoItem).join('')||'<div class="empty">Nenhum retorno pendente. Ao registrar uma conversa, informe "Retornar ao cliente em" e ela aparece aqui.</div>'}</div></div>`;
 h+=`<div class="cols"><div class="card"><h2><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg> Leads para contatar</h2>${ld.map(l=>`<div class="item ${dueClass(l.proximoContato)}" style="cursor:pointer" onclick="verLead('${l.id}')"><div class="grow"><b>${esc(l.nome)}</b> <span class="tag">${esc(l.etapa||'Novo')}</span><div class="sub">${esc(l.assunto||'')}</div></div><span class="rel">${rel(l.proximoContato)}</span></div>`).join('')||'<div class="empty">Nenhum lead com contato marcado para esta semana.</div>'}</div><div class="card"><h2><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v5M18 9.5v5"/></svg> Honorários: atrasados e próximos 30 dias</h2>${[...atras,...prox].sort(by('vencimento')).map(x=>`<div class="item ${dueClass(x.vencimento)}"><div class="grow"><a href="#pessoa/${x.pessoaId}"><b>${esc(nomeP(x.pessoaId))}</b></a> — ${esc(x.descricao||x.tipo||'')}<div class="sub">vence ${fd(x.vencimento)} (${rel(x.vencimento)})</div></div><b class="money">${money(x.valor)}</b><button onclick="receber('${x.id}')">Receber</button></div>`).join('')||'<div class="empty">Nada a receber nos próximos 30 dias.</div>'}</div></div>`;
 h+=`<div class="cols"><div class="card"><h2><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M8 20h8M5 7h14"/><path d="M5 7 2.5 13a2.5 2.5 0 0 0 5 0z"/><path d="M19 7l-2.5 6a2.5 2.5 0 0 0 5 0z"/></svg> Movimentações dos últimos 7 dias</h2>${novid.map(a=>{const p=byId('processos',a.processoId);return p?`<div class="item"><div style="min-width:82px"><b>${fd(a.data)}</b></div><div class="grow"><a href="#processo/${p.id}"><b>${esc(nomeP(p.clienteId))}</b></a> <span class="sub">${esc(p.numero)}</span><div>${esc(a.descricao)}</div></div></div>`:''}).join('')||'<div class="empty">Sem movimentações registradas nos últimos 7 dias.</div>'}</div><div class="card"><h2><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.3A8 8 0 1 1 21 12z"/></svg> Últimas conversas</h2>${ult.map(c=>`<div class="item"><div class="grow"><a href="#pessoa/${c.pessoaId}"><b>${esc(nomeP(c.pessoaId))}</b></a> <span class="sub">${fdt(c.dataHora)} · ${ICON[c.canal]||''} ${esc(c.canal||'')}</span><div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.assunto||c.resumo)}</div></div></div>`).join('')||'<div class="empty">Nenhuma conversa ainda. Use o botão <b><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.3A8 8 0 1 1 21 12z"/></svg> Registrar conversa</b> (ou Alt+C) sempre que falar com um cliente.</div>'}</div></div>`;
 return h};

/* ---------- CONVERSAS ---------- */
VIEWS.conversas=()=>`<div class="top"><div><h1>Histórico de conversas</h1><div class="sub">Tudo o que foi falado com cada cliente, em ordem cronológica.</div></div><div class="acts"><button class="big" onclick="novo('conversas')"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.3A8 8 0 1 1 21 12z"/></svg> Registrar conversa</button></div></div>
<div class="filters"><input type="search" placeholder="Buscar no texto, cliente, assunto, processo…" value="${esc(st.cq)}" oninput="st.cq=this.value;upd(lConversas)"><select onchange="st.cc=this.value;upd(lConversas)"><option value="">Todos os canais</option>${OPT.canal.map(o=>opt(o,st.cc)).join('')}</select><select onchange="st.cr=this.value;upd(lConversas)"><option value="">Todas as conversas</option>${opt('p',st.cr,'Só com retorno pendente')}</select></div><div id="lst">${lConversas()}</div>`;
function lConversas(){const q=norm(st.cq);const a=db.conversas.filter(c=>(!st.cc||c.canal===st.cc)&&(!st.cr||(c.pessoaId&&c.retorno&&!c.retornoFeito))&&(!q||norm([quem(c),c.assunto,c.resumo,c.proximo,numProc(c.processoId)].join(' ')).includes(q))).sort(by('dataHora')).reverse();return timeline(a.slice(0,300))+(a.length>300?`<div class="sub">Mostrando 300 de ${a.length}. Refine a busca.</div>`:'')}

/* ---------- PROCESSOS ---------- */
VIEWS.processos=()=>`<div class="top"><div><h1>Processos</h1><div class="sub">${db.processos.length} cadastrados · ${db.processos.filter(ativoP).length} em andamento · ${db.processos.length-db.processos.filter(ativoP).length} encerrados/arquivados</div></div><div class="acts"><button class="pri" onclick="novo('processos')">+ Novo processo</button></div></div>${(()=>{const n=db.processos.filter(p=>procAtivo(p)&&pareceEncerrado(p)).length;return n?`<div class="banner" style="border-left:4px solid #e0b100"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.3v.01"/></svg> <b>${n} processo(s)</b> estão como ativos, mas o último andamento indica baixa ou arquivamento. <button onclick="st.ps='parece';render()">Ver a lista</button><button class="pri" onclick="encerrarTodos()"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/></svg> Arquivar todos</button></div>`:''})()}
<div class="filters"><input type="search" placeholder="Buscar nº, cliente, parte contrária, pasta, vara…" value="${esc(st.pq)}" oninput="st.pq=this.value;upd(lProcessos)"><select onchange="st.ps=this.value;upd(lProcessos)">${opt('and',st.ps,'Em andamento')}${opt('enc',st.ps,'Encerrados')}${opt('todos',st.ps,'Todos')}${opt('parece',st.ps,'Ativos que parecem encerrados (conferir)')}</select><select onchange="st.pt=this.value;upd(lProcessos)"><option value="">Todos os tribunais</option>${[...new Set(db.processos.map(p=>p.tribunal).filter(Boolean))].sort().map(o=>opt(o,st.pt)).join('')}</select><select onchange="st.pa=this.value;upd(lProcessos)"><option value="">Todas as áreas</option>${OPT.area.map(o=>opt(o,st.pa)).join('')}</select><select onchange="st.pr=this.value;upd(lProcessos)"><option value="">Todos os responsáveis</option>${[...new Set(db.processos.map(p=>p.responsavel).filter(Boolean))].sort().map(o=>opt(o,st.pr)).join('')}</select><select onchange="st.pp=this.value;upd(lProcessos)"><option value="">Com ou sem parceria</option>${opt('__com',st.pp,'Só em parceria')}${uniqVals('processos','parceiro').map(o=>opt(o,st.pp,'Parceria: '+o)).join('')}</select></div><div id="lst">${lProcessos()}</div>`;
function lProcessos(){const q=norm(st.pq);
 const a=db.processos.filter(p=>{const s=p.status||'Ativo';if(st.ps==='and'&&!['Ativo','Suspenso'].includes(s))return false;if(st.ps==='parece'&&!(procAtivo(p)&&pareceEncerrado(p)))return false;if(st.ps==='enc'&&['Ativo','Suspenso'].includes(s))return false;if(st.ps&&!['and','todos','parece','enc'].includes(st.ps)&&s!==st.ps)return false;if(st.pa&&p.area!==st.pa)return false;if(st.pt&&p.tribunal!==st.pt)return false;if(st.pr&&p.responsavel!==st.pr)return false;if(st.pp&&(st.pp==='__com'?!p.parceiro:p.parceiro!==st.pp))return false;return!q||norm([p.numero,p.acao,nomesCli(p),nomeP(p.contrariaId),p.vara,p.comarca,p.tribunal,p.pasta].join(' ')).includes(q)}).sort((x,y)=>nomeP(x.clienteId).localeCompare(nomeP(y.clienteId),'pt-BR'));
 if(!a.length)return'<div class="empty">Nenhum processo encontrado.</div>';
 return`<div class="sub" style="margin-bottom:6px">${a.length} processo(s)${a.length>300?' — mostrando 300, use a busca ou os filtros':''}</div><div class="list">`+a.slice(0,300).map(p=>{const m=lastMov(p.id);return`<div class="row" onclick="go('processo/${p.id}')"><div class="grow"><b>${esc(nomeP(p.clienteId))}</b>${p.contrariaId?` <span class="sub">× ${esc(nomeP(p.contrariaId))}</span>`:''} <span class="tag ${stTag(p.status)}">${esc(p.status||'Ativo')}</span><div class="sub">${esc(p.numero||'(sem número)')} · ${esc(p.tribunal||'')}${p.comarca?' · '+esc(p.comarca):''}${p.pasta?' · pasta '+esc(p.pasta):''}${p.parceiro?' · <svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.6a6.5 6.5 0 0 1 3.5 5.4"/></svg> '+esc(p.parceiro):(p.responsavel&&p.responsavel!==ME.nome?' · resp. '+esc(p.responsavel):'')}</div>${p.acao?`<div class="sub">${esc(p.acao)}${p.valorCausa?' · '+money(p.valorCausa):''}</div>`:''}${m?`<div class="sub">Últ. mov. ${fd(m.data)}: ${esc(m.descricao.slice(0,110))}${m.descricao.length>110?'…':''}</div>`:''}</div><div class="hide-m">${nextPrazo(p.id)}</div></div>`}).join('')+'</div>'}
VIEWS.processo=id=>{const p=byId('processos',id);if(!p)return'<div class="empty">Processo não encontrado. <a href="#processos">Voltar</a></div>';
 const and=db.andamentos.filter(a=>a.processoId===id).sort(by('data','criado')).reverse(),prz=db.prazos.filter(a=>a.processoId===id).sort(by('data','hora')),cv=db.conversas.filter(a=>a.processoId===id).sort(by('dataHora')).reverse(),hn=db.honorarios.filter(a=>a.processoId===id).sort(by('vencimento'));
 const I=(l,v)=>v?`<div><dt>${l}</dt><dd>${v}</dd></div>`:'';
 const pasta=p.pasta?(/^https?:/.test(p.pasta)?`<a href="${esc(p.pasta)}" target="_blank">abrir</a>`:esc(p.pasta)):'';
 let h=`<div class="printhead"><img src="${LOGO}"><div><b class="serif" style="font-size:20px">${ME.nome}</b><div class="sub">${ME.oab}</div></div></div><div class="top"><div><div class="sub"><a href="#processos">← Processos</a></div><h1>${esc(nomeP(p.clienteId))}${p.contrariaId?' <span style="font-size:20px;color:var(--mut)">× '+esc(nomeP(p.contrariaId))+'</span>':''}</h1><div>${esc(p.numero||'(sem número)')} <span class="tag ${stTag(p.status)}">${esc(p.status||'Ativo')}</span> ${p.area?`<span class="tag n">${esc(p.area)}</span>`:''}</div></div><div class="acts"><button class="big" onclick="novo('conversas',{pessoaId:'${p.clienteId}',processoId:'${id}'})"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.3A8 8 0 1 1 21 12z"/></svg> Conversa</button><button onclick="novo('andamentos',{processoId:'${id}'})">+ Andamento</button><button onclick="novo('prazos',{processoId:'${id}',pessoaId:'${p.clienteId}'})">+ Prazo</button>${procAtivo(p)?`<button onclick="encerrarProc('${id}')"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/></svg> Encerrar / arquivar</button>`:`<button onclick="reabrirProc('${id}')">↺ Reabrir</button>`}<button onclick="edit('processos','${id}')"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg> Editar</button><button onclick="window.print()"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg></button></div></div>`;
 {const b=procAtivo(p)&&pareceEncerrado(p);if(b)h+=`<div class="banner" style="border-left:4px solid #e0b100"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.3v.01"/></svg> Este processo está como <b>${esc(p.status||'Ativo')}</b>, mas há sinal de encerramento: <i>${esc(b.txt.slice(0,120))}</i>${b.data?' ('+fd(b.data)+')':''}. <button class="pri" onclick="encerrarProc('${id}')"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/></svg> Encerrar / arquivar</button></div>`}
 if(p.situacao)h+=`<div class="situ"><div class="sub">Situação atual (para explicar ao cliente)</div>${esc(p.situacao)}</div>`;
 h+=`<div class="card"><dl class="info">${I((p.outrosClientes||[]).length?'Clientes':'Cliente',`<a href="#pessoa/${p.clienteId}">${esc(nomeP(p.clienteId))}</a>${(p.outrosClientes||[]).map(o=>`, <a href="#pessoa/${o}">${esc(nomeP(o))}</a>`).join('')}${p.polo?' ('+esc(p.polo)+')':''}`)}${I('Parte contrária',p.contrariaId?`<a href="#pessoa/${p.contrariaId}">${esc(nomeP(p.contrariaId))}</a>`:'')}${I('Ação',esc(p.acao))}${I('Tribunal',esc(p.tribunal))}${I('Vara / Órgão',esc(p.vara))}${I('Comarca',esc(p.comarca))}${I('Distribuição',fd(p.distribuicao))}${I('Valor da causa',p.valorCausa!==''&&p.valorCausa!=null?money(p.valorCausa):'')}${I('Pasta',pasta)}${I('Responsável',esc(p.responsavel))}${I('Parceria',p.parceiro?esc(p.parceiro)+(p.parceriaPct?` (${esc(p.parceriaPct)}% dos honorários)`:''):'')}${I('Encerrado em',fd(p.dataEncerramento))}${I('Advogado contrário',esc(p.advContrario))}${I('Observações',esc(p.obs))}</dl></div>`;
 const T=[['and','Andamentos',and.length],['prz','Prazos',prz.filter(z=>!z.feito).length],['conv','Conversas',cv.length],['hon','Honorários',hn.length]];

7z"/></svg></button></div></div>`;
 const T=[['conv','Conversas',cv.length],['proc','Processos',pr.length],['prz','Prazos',pz.filter(z=>!z.feito).length],['hon','Honorários',hn.length],['dados','Dados','']];
 h+=`<div class="tabs">${T.map(([k,l,n])=>`<button class="${st.etab===k?'on':''}" onclick="st.etab='${k}';render()">${l}${n!==''?' ('+n+')':''}</button>`).join('')}</div>`;

<div class="filters"><input type="search" placeholder="Buscar…" value="${esc(st.zq)}" oninput="st.zq=this.value;upd(lPrazos)"><select onchange="st.zs=this.value;upd(lPrazos)">${opt('pend',st.zs,'Pendentes')}${opt('feitos',st.zs,'Cumpridos')}${opt('todos',st.zs,'Todos')}</select><select onchange="st.zt=this.value;upd(lPrazos)"><option value="">Todos os tipos</option>${OPT.tipoPrazo.map(o=>opt(o,st.zt)).join('')}</select></div><div id="lst">${lPrazos()}</div>`;
function lPrazos(){const q=norm(st.zq),t=todayStr();let a=db.prazos.filter(p=>(st.zs==='todos'||(st.zs==='feitos'?p.feito:!p.feito))&&(!st.zt||p.tipo===st.zt)&&(!q||norm([p.titulo,p.tipo,numProc(p.processoId),nomeP(p.pessoaId),p.local,p.obs].join(' ')).includes(q))).sort(by('data','hora'));if(st.zs==='feitos')a.reverse();
 if(!a.length)return'<div class="empty">Nenhum prazo.</div>';let h='',last=null;
 for(const p of a){const g=!p.feito&&p.data<t?'<svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.3v.01"/></svg> Atrasados':diaExt(p.data);if(g!==last){if(last!==null)h+='</div>';h+=`<div class="day">${g}</div><div class="card" style="padding:6px 12px">`;last=g}h+=prazoItem(p)}return h+'</div>'}
function exportICS(){const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');const a=db.prazos.filter(p=>!p.feito&&p.data);if(!a.length){alert('Nenhum prazo pendente.');return}
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DNsis Escritorio//PT-BR','CALSCALE:GREGORIAN'];const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 for(const p of a){const d=p.data.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+p.id+'@dnsis-escritorio','DTSTAMP:'+stamp);if(p.hora){const[hh,mm]=p.hora.split(':');const end=pad((+hh+1)%24)+mm;L.push(`DTSTART:${d}T${hh}${mm}00`,`DTEND:${d}T${end}00`)}else L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addDays(p.data,1).replace(/-/g,''));
  L.push('SUMMARY:'+e(`${p.tipo||'Prazo'}: ${p.titulo}${p.pessoaId?' – '+nomeP(p.pessoaId):''}`),'DESCRIPTION:'+e([numProc(p.processoId),p.obs].filter(Boolean).join('\n')));if(p.local)L.push('LOCATION:'+e(p.local));L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Lembrete','TRIGGER:-P1D','END:VALARM','END:VEVENT')}
 L.push('END:VCALENDAR');download(L.join('\r\n'),'prazos-'+todayStr()+'.ics','text/calendar');toast(a.length+' compromisso(s) exportado(s).')}

VIEWS.leads=()=>{const ab=db.leads.filter(aberto),fe=db.leads.filter(l=>l.etapa==='Fechado'),pe=db.leads.filter(l=>l.etapa==='Perdido');const tx=fe.length+pe.length?Math.round(fe.length*100/(fe.length+pe.length))+'%':'—';
 const orig={};db.leads.forEach(l=>{const o=l.origem||'Não informado';orig[o]=orig[o]||{n:0,f:0};orig[o].n++;if(l.etapa==='Fechado')orig[o].f++});

 if(!db.leads.length)return`<div class="card empty">Nenhum lead ainda. Cadastre aqui quem entra em contato pedindo orientação ou orçamento — assim nada se perde e você vê quantos viram clientes.<br><br><button class="pri" onclick="novo('leads')">+ Cadastrar o primeiro lead</button></div>`;

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function pkce() {
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));

  return { v, c };
}

    dbx = { refresh: j.refresh_token, access: j.access_token, exp: Date.now() + (j.expires_in - 60) * 1000, conta: j.account_id };
    localStorage.setItem(DBX_TOK, JSON.stringify(dbx));

  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 400 || r.status === 401) { sairDropbox(true) } throw new Error(j.error_description || 'falha ao renovar acesso') }
  dbx.access = j.access_token; dbx.exp = Date.now() + (j.expires_in - 60) * 1000;

function lerImagem(f) {
  return new Promise((ok, erro) => {
    const r = new FileReader(); r.onerror = () => erro(new Error('não consegui ler a imagem'));
    r.onload = () => {
      const img = new Image(); img.onerror = () => erro(new Error('formato de imagem não suportado'));
      img.onload = () => {
        const max = 1800, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  });
}

        alertas: { type: 'string', description: 'Dúvidas ou pontos que o advogado precisa conferir (ex.: data de publicação não aparece, prazo ambíguo). Vazio se nenhum.' }
      }, required: ['tipo', 'titulo', 'obs']
    }
  },
  leads: {
    name: 'lancar_lead', description: 'Registra no DNsis um potencial cliente (lead) extraído do material enviado.',
    input_schema: {
      type: 'object', properties: {
        nome: { type: 'string', description: 'Nome da pessoa. Se não aparecer, use o nome do contato do WhatsApp ou "(sem nome)".' },
        telefone: { type: 'string', description: 'Telefone/WhatsApp com DDD, se aparecer.' },
        email: { type: 'string' },
        origem: { type: 'string', enum: [...OPT.origem, ''] },
        area: { type: 'string', enum: [...OPT.area, ''] },
        assunto: { type: 'string', description: 'O problema ou pedido da pessoa, resumido de forma fiel em 1 a 3 frases.' },
        proximo_contato: { type: 'string', description: 'AAAA-MM-DD, se o material indicar quando retornar. Vazio se não indicar.' },
        valor: { type: 'number', description: 'Honorários estimados, só se o material mencionar valor.' },
        obs: { type: 'string', description: 'Outras informações úteis: benefícios, datas, documentos citados, cidade, etc.' },
        alertas: { type: 'string', description: 'O que o advogado deve conferir. Vazio se nenhum.' }
      }, required: ['nome', 'assunto']
    }
  }
};
function iaSistema(col) {
  const hoje = todayStr(), dia = new Date().toLocaleDateString('pt-BR', { weekday: 'long' });
  const base = `Você é o assistente do DNsis, sistema do escritório de Daniele Nascimento (Bauru-SP; atua em Direito Previdenciário e Direito do Consumidor). Hoje é ${dia}, ${hoje}. Leia o texto e/ou as imagens (prints de WhatsApp, intimações, e-mails, PDFs fotografados) e chame a ferramenta com os dados. Seja fiel ao material: não invente nomes, números, datas ou conteúdo de decisões. Datas sem ano: use o ano mais provável perto de hoje. Escreva em português do Brasil.`;
  if (col === 'leads') return base + ` Trata-se de um NOVO CONTATO (lead). Mensagem recebida por WhatsApp → origem "WhatsApp", salvo se o texto indicar outra (indicação, Instagram...). Classifique a área pelo assunto (ex.: LOAS, aposentadoria, auxílio-doença, BPC, pensão por morte, salário-maternidade → Previdenciário; cobrança indevida, negativação, banco, empréstimo consignado, RMC/RCC, compra pela internet, plano de saúde, telefonia → Consumidor).`;
  return base + ` Trata-se de um PRAZO ou COMPROMISSO. Regras:
- Intimação/publicação com prazo a contar: tipo "Prazo", "data" vazia, informe data_disponibilizacao e/ou data_publicacao e dias_uteis; o DNsis calcula a data final. Use o prazo fixado no ato; se não houver, o legal: recurso inominado (JEF/JEC) 10; apelação, agravo de instrumento, contrarrazões, contestação/réplica e manifestação sobre laudo 15; embargos de declaração 5; ato sem prazo expresso 5 (CPC 218 §3º); Justiça do Trabalho: recurso ordinário e contrarrazões 8, embargos 5. Prazos do processo eletrônico em dias úteis.
- Se o material trouxer a data final expressa ("até 20/11"), preencha "data" com ela.
- Audiência, perícia, reunião: tipo correspondente, data e hora do ato, local e o que o cliente deve levar nos obs.
- Intimação pelo portal sem data de ciência clara: deixe data_publicacao vazia e explique em alertas.
- Em obs, explique a contagem (ato, publicação, fundamento) de forma objetiva.`;
}

async function iaChamar(col, texto, imagens) {
  const chave = iaChave(); if (!chave) throw new Error('Cadastre a chave da API do Claude em Backup e ajustes.');
  const content = imagens.map(b => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b } }));
  content.push({ type: 'text', text: (texto || '').trim() || '(sem texto; use as imagens)' });
  const tool = IA_TOOLS[col];
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': chave, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: IA_MODELO, max_tokens: 8000, system: iaSistema(col) + `\n\nResponda SEMPRE chamando a ferramenta ${tool.name}, uma única vez, sem texto adicional.`, tools: [tool], tool_choice: { type: 'auto' }, messages: [{ role: 'user', content }] })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = (j.error && j.error.message) || ('HTTP ' + r.status);
    if (r.status === 401) throw new Error('chave da API inválida. Confira em Backup e ajustes.');
    if (/credit|balance/i.test(m)) throw new Error('sem créditos na conta da API (console.anthropic.com → Billing).');
    throw new Error(m);
  }
  const u = (j.content || []).find(c => c.type === 'tool_use');
  if (u) return u.input;
  // reserva: se o modelo respondeu em texto, tenta achar um JSON na resposta
  const txt = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
  const m = txt.match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]) } catch (e) { } }
  throw new Error('a IA não devolveu os dados. Tente de novo.');
}

/* ---------- localizar processo / cliente no DNsis ---------- */
function iaAcharProcesso(numero) {
  const d = String(numero || '').replace(/\D/g, ''); if (d.length < 15) return null;
  return db.processos.find(p => String(p.numero || '').replace(/\D/g, '') === d) || null;
}
function iaAcharPessoa(nome) {
  const n = norm(nome).trim(); if (n.length < 4) return null;
  const ex = db.pessoas.filter(p => norm(p.nome) === n); if (ex.length === 1) return ex[0];
  const c = db.pessoas.filter(p => norm(p.nome).includes(n) || (n.includes(norm(p.nome)) && norm(p.nome).length > 8));
  return c.length === 1 ? c[0] : null;
}

function iaMontar(col, x) {
  const avisos = [], rec = {};
  if (x.alertas) avisos.push(x.alertas);
  if (col === 'leads') {
    Object.assign(rec, { nome: x.nome || '', telefone: x.telefone || '', email: x.email || '', origem: x.origem || '', area: x.area || '', assunto: x.assunto || '', etapa: 'Novo', obs: x.obs || '' });
    if (x.proximo_contato) rec.proximoContato = x.proximo_contato;
    if (x.valor) rec.valor = x.valor;
    const tel = String(x.telefone || '').replace(/\D/g, '').slice(-8);
    const ja = tel && [...db.leads, ...db.pessoas].find(p => String(p.telefone || '').replace(/\D/g, '').slice(-8) === tel);
    const jaNome = !ja && iaAcharPessoa(x.nome);
    if (ja || jaNome) avisos.push(`Já existe no DNsis alguém com ${ja ? 'este telefone' : 'este nome'}: ${(ja || jaNome).nome}. Confira se não é duplicado${db.pessoas.includes(ja || jaNome) ? ' (é cliente cadastrado)' : ''}.`);
    return { rec, avisos };
  }
  const proc = iaAcharProcesso(x.numero_processo);
  const pes = proc ? byId('pessoas', proc.clienteId) : iaAcharPessoa(x.cliente);
  if (x.numero_processo && !proc) avisos.push(`O processo ${x.numero_processo} não está cadastrado no DNsis.`);
  if (!proc && x.cliente && !pes) avisos.push(`Não encontrei o cliente "${x.cliente}" no DNsis: escolha no campo Cliente.`);
  Object.assign(rec, { tipo: x.tipo || 'Prazo', titulo: x.titulo || '', hora: x.hora || '', local: x.local || '', processoId: proc ? proc.id : '', pessoaId: pes ? pes.id : '', obs: x.obs || '' });
  let contagem = '';
  if (x.data) rec.data = x.data;
  else if (x.dias_uteis > 0 && (x.data_publicacao || x.data_disponibilizacao)) {
    const j = x.justica || justicaNum(proc ? proc.numero : x.numero_processo) || 'federal';
    const pub = x.data_publicacao || isoD(proxUtil(parseD(x.data_disponibilizacao), j));
    rec.data = prazoFinal(pub, x.dias_uteis, j);
    contagem = `Contagem do DNsis: ${x.data_disponibilizacao ? 'disponibilizado em ' + fd(x.data_disponibilizacao) + ', ' : ''}publicação/ciência em ${fd(pub)}; início em ${fd(isoD(proxUtil(parseD(pub), j)))}; ${x.dias_uteis} dias úteis (Justiça ${j}, feriados nacionais${j === 'federal' ? ', da Justiça Federal' : j === 'estadual' ? ', de SP' : ''} e recesso de 20/12 a 20/01) → prazo final ${fd(rec.data)}. Feriados municipais da comarca não estão incluídos.`;
  } else if (rec.tipo === 'Prazo') {
    rec.data = todayStr(); avisos.push('Não deu para calcular a data final (falta a data de publicação ou o número de dias). Deixei HOJE: corrija a data.');
  }
  if (rec.tipo === 'Prazo' && !/^CONFERIR/.test(rec.titulo)) rec.titulo = 'CONFERIR – ' + rec.titulo;
  rec.obs = [rec.obs, contagem, 'Preenchido com IA – conferir antes de cumprir.'].filter(Boolean).join('\n\n');
  return { rec, avisos };
}

/* ---------- caixa "Preencher com IA" nos formulários de Novo lead / Novo prazo ---------- */
const _openFormBase = openForm;
openForm = function (title, col, rec, opts = {}) {
  _openFormBase(title, col, rec, opts);
  if (!['leads', 'prazos'].includes(col) || (rec && rec.id)) return;
  const frm = $('#frm'); if (!frm) return;
  const box = document.createElement('div'); box.className = 'w2'; box.id = 'iabox';
  box.style.cssText = 'grid-column:1/-1;background:#f3ecdf;border:1px solid #e2d6bf;border-radius:10px;padding:10px 12px;margin-bottom:4px';
  box.innerHTML = opts.iaAvisos !== undefined
    ? `<b><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 14.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg> Preenchido com IA – confira tudo antes de salvar.</b>${opts.iaAvisos.length ? '<ul style="margin:6px 0 0 18px;padding:0">' + opts.iaAvisos.map(a => `<li>${esc(a)}</li>`).join('') + '</ul>' : ''}`
    : `<b><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 14.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg> Preencher com IA</b> <span class="sub">– cole o texto e/ou envie prints; a IA preenche o formulário para você conferir.</span>
      <textarea id="iaTxt" rows="3" style="width:100%;margin-top:6px;box-sizing:border-box" placeholder="${col === 'leads' ? 'Cole aqui a mensagem do WhatsApp, e-mail…' : 'Cole aqui a intimação, publicação, despacho…'}"></textarea>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">
        <label class="btn" style="cursor:pointer"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg> Imagens / prints<input id="iaImg" type="file" accept="image/*" multiple style="display:none" onchange="$('#iaQt').textContent=this.files.length?this.files.length+' imagem(ns)':''"></label>
        <span id="iaQt" class="sub"></span><span class="grow" style="flex:1"></span>
        <button type="button" class="pri" id="iaBtn" onclick="iaPreencher('${col}')"><svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 14.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg> Preencher</button>
      </div><div id="iaSt" class="sub" style="margin-top:4px"></div>`;
  frm.insertBefore(box, frm.firstChild);
};
async function iaPreencher(col) {
  const st = $('#iaSt'), bt = $('#iaBtn');
  if (!iaChave()) { st.innerHTML = 'Primeiro cadastre a chave da API em <a href="#config" onclick="closeModal()">Backup e ajustes</a>.'; return }
  const texto = $('#iaTxt').value, fs = [...($('#iaImg').files || [])].slice(0, 5);
  if (!texto.trim() && !fs.length) { st.textContent = 'Cole um texto ou escolha uma imagem.'; return }
  if (!navigator.onLine) { st.textContent = 'Sem internet: a IA precisa de conexão.'; return }
  bt.disabled = true; st.textContent = 'Lendo' + (fs.length ? ' as imagens' : '') + '…';
  try {
    const imgs = []; for (const f of fs) imgs.push(await lerImagem(f));
    st.textContent = 'A IA está analisando…';
    const x = await iaChamar(col, texto, imgs);
    const { rec, avisos } = iaMontar(col, x);
    closeModal();
    openForm(NOVO[col] + ' (IA)', col, rec, { iaAvisos: avisos });
  } catch (e) { st.textContent = 'Erro: ' + e.message; bt.disabled = false }
}

${iaChave() ? `<p>Chave cadastrada: <b>…${esc(iaChave().slice(-6))}</b></p><div class="acts"><button onclick="iaTestar()">Testar</button><button onclick="if(confirm('Remover a chave deste aparelho?')){localStorage.removeItem(IA_KEY);render()}">Remover</button></div>`
  : `<div class="acts"><input id="iaKeyIn" type="password" placeholder="sk-ant-…" autocomplete="off" style="flex:1;min-width:220px"><button class="pri" onclick="const v=$('#iaKeyIn').value.trim();if(!/^sk-ant-/.test(v)){alert('A chave começa com sk-ant-');return}localStorage.setItem(IA_KEY,v);render();iaTestar()">Salvar</button></div>`}
<div id="iaTst" class="sub" style="margin-top:6px"></div></div>`;
async function iaTestar() {
  const o = $('#iaTst'); if (o) o.textContent = 'testando…';
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': iaChave(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: IA_MODELO, max_tokens: 5, messages: [{ role: 'user', content: 'Responda só: ok' }] }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 401 ? 'chave inválida' : ((j.error && j.error.message) || 'HTTP ' + r.status));
    if (o) o.innerHTML = '<svg class="ie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg> Funcionando.';
  } catch (e) { if (o) o.textContent = 'Erro: ' + e.message }
}
